# Copy this file to config.yaml and fill in your real values.

volcengine:
  api_key: "YOUR_API_KEY_HERE"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  model: "deepseek-v3-241226"
  daily_token_budget: 100000
  rpm_limit: 20

# LLM generation tuning. Higher temperature = more creative/varied but
# less predictable. Penalties reduce repetition of words/topics.
llm:
  temperature: 1.0          # 0.7-1.2 typical; 1.0 default
  presence_penalty: 0.6      # -2.0 to 2.0; 0.6 = encourages new topics
  frequency_penalty: 0.4     # -2.0 to 2.0; 0.4 = discourages repeated words

schedule:
  run_at: "06:00"

output:
  daily_count: 20
  drafts_dir: "./drafts"

platforms:
  wechat: { enabled: true,  char_min: 1500, char_max: 2500 }
  bjh:    { enabled: true,  char_min: 800,  char_max: 1500 }

blacklist_file: "./data/blacklist.txt"
generated_topics_file: "./data/generated_topics.jsonl"
hot_topics_db: "./data/hot_topics.db"
logs_dir: "./logs"
